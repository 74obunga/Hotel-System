<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Savanna Crest Hotel | Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#EDF1F0;--sf:#FFFFFF;--sf2:#F4F7F6;--ink:#13222B;--mut:#5B6C75;--line:#D9E1DF;
--brand:#0D6A6A;--brand2:#0A5555;--onbrand:#FFFFFF;--brass:#B0802A;--side:#10242B;--sideink:#B9CBCB;--sidehi:#1C3B43;
--ok:#1F8556;--occ:#2A5DAB;--warn:#A96209;--bad:#B23A32;
--okbg:#E1F2E9;--occbg:#E2EAF8;--warnbg:#FAEACF;--badbg:#F8E0DE;--brandbg:#DAEEED;
--c1:#0D6A6A;--c2:#B0802A;--c3:#2A5DAB;--c4:#8A5A9C;--c5:#C0523A;--c6:#6E8B2A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg:#0B1518;--sf:#132126;--sf2:#182A30;--ink:#E4EEEE;--mut:#8FA4A8;--line:#243A41;
--brand:#38B2A6;--brand2:#2C9A8F;--onbrand:#06201E;--brass:#D9A649;--side:#08110F;--sideink:#9DB3B3;--sidehi:#152A30;
--ok:#4CC58A;--occ:#6E9DEB;--warn:#E3A044;--bad:#EA7A70;
--okbg:#12352A;--occbg:#15294A;--warnbg:#3A2A10;--badbg:#3D1A18;--brandbg:#12332F;
--c1:#38B2A6;--c2:#D9A649;--c3:#6E9DEB;--c4:#B98BCB;--c5:#E58466;--c6:#9DBB55}}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#0B1518;--sf:#132126;--sf2:#182A30;--ink:#E4EEEE;--mut:#8FA4A8;--line:#243A41;
--brand:#38B2A6;--brand2:#2C9A8F;--onbrand:#06201E;--brass:#D9A649;--side:#08110F;--sideink:#9DB3B3;--sidehi:#152A30;
--ok:#4CC58A;--occ:#6E9DEB;--warn:#E3A044;--bad:#EA7A70;
--okbg:#12352A;--occbg:#15294A;--warnbg:#3A2A10;--badbg:#3D1A18;--brandbg:#12332F;
--c1:#38B2A6;--c2:#D9A649;--c3:#6E9DEB;--c4:#B98BCB;--c5:#E58466;--c6:#9DBB55}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.disp{font-family:'Bricolage Grotesque','Public Sans',system-ui,sans-serif;letter-spacing:-.01em;margin:0;font-weight:700}
h1{font-size:20px}h2{font-size:17px}h3{font-size:15px}h4{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--sideink);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow-y:auto;z-index:30}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px;color:#fff}
.brand b{font-family:'Bricolage Grotesque',sans-serif;font-size:15px;display:block;line-height:1.2}
.brand small{color:var(--sideink);font-size:11.5px}
.mark{width:34px;height:34px;flex:none}
#nav{padding:4px 8px 16px;flex:1}
.ng{font-size:11.5px;color:#7F9797;padding:14px 10px 4px;font-weight:600}
.ni{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;color:var(--sideink);border-radius:8px;cursor:pointer;text-align:left}
.ni svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ni:hover{background:var(--sidehi);color:#fff}
.ni[aria-current="page"]{background:var(--sidehi);color:#fff;box-shadow:inset 3px 0 0 var(--brass)}
.ni .n{margin-left:auto;background:var(--brass);color:#111;border-radius:99px;font-size:11px;padding:0 7px;font-weight:600}
.sidefoot{padding:12px 16px;border-top:1px solid var(--sidehi);font-size:12px;color:#8AA0A0}
.main{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 24px;background:var(--sf);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.grow{flex:1}
.menu{display:none}
.scrim{display:none}
.content{padding:20px 24px 48px;max-width:1500px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sf2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.btn.pri:hover{background:var(--brand2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:3px 9px;font-size:12.5px;border-radius:6px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ib{border:1px solid var(--line);background:var(--sf);border-radius:8px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center}
.card{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:16px}
.card>h3,.card>.hd h3{margin-bottom:10px}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.hd h3{margin:0}
.g2,.g3,.g4{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt{margin-top:16px}
.muted{color:var(--mut)}.small{font-size:12.5px}.num{text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bold{font-weight:600}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.85fr);gap:16px}
.occ-big{font-family:'Bricolage Grotesque',sans-serif;font-size:56px;line-height:1;font-weight:700;letter-spacing:-.03em}
.strip{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:14px 0 10px;background:var(--sf2)}
.strip i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi small{color:var(--mut);display:block}
.kpi b{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;letter-spacing:-.02em;display:block;margin-top:2px}
.kpi span{font-size:12px;color:var(--mut)}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--sf2);color:var(--mut);white-space:nowrap;border:1px solid transparent}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.occ{background:var(--occbg);color:var(--occ)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.brand{background:var(--brandbg);color:var(--brand)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
table.t th{font-weight:600;font-size:12.5px;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sf)}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover{background:var(--sf2)}
table.t th.num,table.t td.num{text-align:right}
table.t tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0;background:var(--sf2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--mut);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sf)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;color:var(--mut);font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brandbg);color:var(--brand)}
.bar-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12.5px;color:var(--mut);font-weight:500}
.fld input,.fld select,.fld textarea,.inp{border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
.inp.sm{width:auto;padding:5px 8px}
.fld textarea{resize:vertical;min-height:60px}
.frm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.frm .full{grid-column:1/-1}
.frm.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.note{background:var(--sf2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--warnbg);border-color:transparent;color:var(--warn)}
.note.bad{background:var(--badbg);border-color:transparent;color:var(--bad)}
.note.ok{background:var(--okbg);border-color:transparent;color:var(--ok)}
.empty{padding:28px;text-align:center;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(8,18,20,.55);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto;z-index:50}
.modal.open{display:flex}
.dlg{background:var(--sf);border-radius:12px;width:min(560px,100%);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg.wide{width:min(900px,100%)}
.dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh h2{flex:1}
.db{padding:16px 18px}
.df{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--sf2);border-radius:0 0 12px 12px}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;max-width:340px;font-weight:500}
.toast.bad{background:var(--bad);color:#fff}.toast.ok{background:var(--ok);color:#fff}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--mut);font-size:10.5px}
.hb{display:grid;grid-template-columns:110px minmax(0,1fr) 84px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.hb .b{height:9px;background:var(--sf2);border-radius:5px;overflow:hidden}
.hb .b i{display:block;height:100%;border-radius:5px}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:none}
.list .li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.li .rn{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;min-width:44px}
.tape{border:1px solid var(--line);border-radius:10px;overflow:auto;background:var(--sf);max-height:74vh}
.tr{display:flex;min-width:max-content;width:100%}
.tl{position:sticky;left:0;z-index:3;flex:none;width:138px;background:var(--sf);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 10px;display:flex;flex-direction:column;justify-content:center;height:40px;line-height:1.2}
.tl b{font-family:'Bricolage Grotesque',sans-serif}
.tl small{color:var(--mut);font-size:11px}
.tg{display:grid;flex:1;grid-template-columns:repeat(var(--n),minmax(58px,1fr));grid-template-rows:40px;position:relative}
.tc{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;cursor:pointer;padding:0}
.tc:hover{background:var(--brandbg)}
.tc.wk{background:var(--sf2)}.tc.td{box-shadow:inset 2px 0 0 var(--brass),inset -2px 0 0 var(--brass)}
.tr.head{position:sticky;top:0;z-index:5}
.tr.head .tl,.tr.head .th{background:var(--sf2)}
.th{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;font-size:12px;line-height:1.2;display:flex;flex-direction:column;justify-content:center}
.th.td{color:var(--brand);font-weight:700}
.rb{z-index:2;margin:5px 2px;border-radius:6px;padding:0 8px;font-size:12px;font-weight:500;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:0;cursor:pointer;text-align:left}
.rb.confirmed{background:var(--brandbg);color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.rb.checked_in{background:var(--occ);color:#fff}
.rb.checked_out{background:var(--sf2);color:var(--mut);box-shadow:inset 3px 0 0 var(--line)}
.rb.ooo{background:repeating-linear-gradient(45deg,var(--badbg),var(--badbg) 6px,var(--sf) 6px,var(--sf) 12px);color:var(--bad);cursor:default}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.rc{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--sf);border-top:4px solid var(--line)}
.rc.occupied{border-top-color:var(--occ)}.rc.clean,.rc.inspected{border-top-color:var(--ok)}.rc.dirty{border-top-color:var(--warn)}.rc.ooo{border-top-color:var(--bad)}
.rc .rn{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.cat button{border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:9px 10px;text-align:left;cursor:pointer}
.cat button:hover{border-color:var(--brand);background:var(--brandbg)}
.cat b{display:block;font-weight:600}
.stmt td.sub{padding-left:26px;color:var(--mut)}
.stmt tr.tot td{font-weight:700;border-top:1px solid var(--ink)}
.stmt tr.hdr td{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;padding-top:16px;border-bottom:1px solid var(--line)}
.stmt tr.gt td{font-weight:700;font-size:15px;border-top:2px solid var(--ink);border-bottom:3px double var(--ink)}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:14px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.pay-methods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.pm{border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:9px 6px;cursor:pointer;font-weight:500}
.pm[aria-pressed="true"]{border-color:var(--brand);background:var(--brandbg);color:var(--brand)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}}
@media (max-width:900px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:250px;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
 .app.nav-open .side{transform:none}
 .app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
 .menu{display:grid}
 .top{padding:10px 14px}.content{padding:16px 14px 40px}
 .g2,.g3{grid-template-columns:1fr}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .frm,.frm.c3{grid-template-columns:1fr}
 .hb{grid-template-columns:90px minmax(0,1fr) 74px}
 .occ-big{font-size:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
 <aside class="side" id="side" aria-label="Main navigation">
  <div class="brand">
   <svg class="mark" viewBox="0 0 36 36" aria-hidden="true"><rect x="3" y="2" width="30" height="32" rx="7" fill="#B0802A"/><circle cx="18" cy="11" r="3.4" fill="#10242B"/><path d="M18 14.5v14M18 21h5M18 26h4" stroke="#10242B" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
   <div><b id="hname">Savanna Crest Hotel</b><small>Hotel operations</small></div>
  </div>
  <nav id="nav"></nav>
  <div class="sidefoot" id="bdate"></div>
 </aside>
 <div class="scrim" data-act="navClose"></div>
 <div class="main">
  <header class="top">
   <button class="ib menu" data-act="navToggle" aria-label="Open menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
   <h1 id="ttl">Dashboard</h1>
   <div class="grow"></div>
   <button class="ib" data-act="theme" aria-label="Switch colour theme" title="Switch colour theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
   <button class="btn pri" data-act="newBooking">New booking</button>
  </header>
  <main id="view" class="content"></main>
 </div>
</div>
<div id="modal" class="modal" role="dialog" aria-modal="true"></div>
<div id="toasts" aria-live="polite"></div>
<script>
(function(){
'use strict';
/* ---------- utilities ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round2=n=>Math.round((n+Number.EPSILON)*100)/100;
const sum=(a,k)=>a.reduce((s,x)=>s+(typeof k==='function'?k(x):x[k]||0),0);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const todayISO=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const nightsBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const nowTime=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const fmtD=s=>{if(!s)return'';const d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const fmtS=s=>{const d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
const dow=s=>new Date(s+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short'});
const isWk=s=>{const g=new Date(s+'T12:00:00').getDay();return g===0||g===6};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const LS='hms.v1';
let S=null;
const cur=()=>S.settings.currency;
const money=n=>(n<0?'-':'')+cur()+' '+Math.round(Math.abs(n)).toLocaleString('en-US');
const money2=n=>(n<0?'-':'')+cur()+' '+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const short=n=>{const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'')+'M':a>=1e3?(n/1e3).toFixed(0)+'k':String(Math.round(n))};
const pct=n=>(isFinite(n)?Math.round(n*100):0)+'%';

/* ---------- seed data ---------- */
function seed(){
 const T=todayISO();

 s+=`</g><text x="75" y="73" text-anchor="middle" style="font:700 16px 'Bricolage Grotesque',sans-serif;fill:var(--ink)">${short(tot)}</text><text x="75" y="89" text-anchor="middle" style="font-size:10.5px;fill:var(--mut)">${esc(o.center||'')}</text></svg>`;
 return `<div class="donut">${s}<div class="legend" style="flex-direction:column;gap:6px">${items.map(it=>`<span><i style="background:${it.color}"></i>${esc(it.label)} <b>${pct(it.value/tot)}</b></span>`).join('')}</div></div>`}
const hbars=(items,fmt)=>{fmt=fmt||money;const m=Math.max(...items.map(i=>i.value),1);return items.length?items.map(i=>`<div class="hb"><span>${esc(i.label)}</span><div class="b"><i style="width:${i.value/m*100}%;background:${i.color||'var(--c1)'}"></i></div><b class="num">${fmt(i.value)}</b></div>`).join(''):empty('No data in this period')};
const kpi=(l,v,s)=>`<div class="kpi"><small>${l}</small><b>${v}</b>${s?`<span>${s}</span>`:''}</div>`;
const rangeBar=()=>`<div class="bar-top"><div class="seg" role="group" aria-label="Period">${[['today','Today'],['7d','7 days'],['30d','30 days'],['month','This month'],['last','Last month'],['ytd','Year to date']].map(([k,l])=>`<button data-act="preset" data-p="${k}" aria-pressed="${ui.range.preset===k}">${l}</button>`).join('')}</div><input class="inp sm" type="date" id="rf" value="${ui.range.from}" data-ch="range" aria-label="From date"><span class="muted">to</span><input class="inp sm" type="date" id="rt" value="${ui.range.to}" data-ch="range" aria-label="To date"></div>`;
const tabs=(cur,list,act)=>`<div class="tabs" role="tablist">${list.map(([k,l])=>`<button class="tab" role="tab" data-act="${act}" data-k="${k}" aria-selected="${cur===k}">${l}</button>`).join('')}</div>`;
const csvBtn=(what)=>`<button class="btn sm" data-act="csv" data-what="${what}">Download CSV</button>`;

/* ---------- dashboard ---------- */
V.dashboard=()=>{
 const T=todayISO(),f30=addDays(T,-29),ms=T.slice(0,8)+'01',from=ms<f30?ms:f30;
 const sellable=S.rooms.filter(r=>!r.ooo).length||1;
 const inh=S.res.filter(r=>r.status==='checked_in');
 const arr=S.res.filter(r=>r.status==='confirmed'&&r.checkIn<=T),dep=inh.filter(r=>r.checkOut<=T);
 const led=ledger(from,T),ch=led.filter(x=>x.type==='charge'),in30=ch.filter(x=>x.date>=f30),rooms30=in30.filter(x=>x.dept==='Rooms');
 const roomRev=sum(rooms30,'net'),adr=rooms30.length?roomRev/rooms30.length:0,revpar=roomRev/(S.rooms.length*30);
 const revToday=sum(ch.filter(x=>x.date===T),'net'),revMtd=sum(ch.filter(x=>x.date>=ms),'net');
 const collected=sum(led.filter(x=>x.date===T&&x.type==='payment'),'amount')-sum(led.filter(x=>x.date===T&&x.type==='refund'),'amount');
 const ar=receivables(),arTot=sum(ar,x=>x.f.balance);
 const st={occupied:0,clean:0,inspected:0,dirty:0,ooo:0};S.rooms.forEach(r=>st[roomState(r)]++);
 const occ=st.occupied/sellable;
 const d14=[];for(let i=13;i>=0;i--)d14.push(addDays(T,-i));
 const roomsD=d14.map(d=>sum(ch.filter(x=>x.date===d&&x.dept==='Rooms'),'net')),otherD=d14.map(d=>sum(ch.filter(x=>x.date===d&&x.dept!=='Rooms'),'net'));
 const o28=[],l28=[];for(let i=-13;i<=14;i++){const d=addDays(T,i);l28.push(fmtS(d));o28.push(Math.round(occOn(d)/(availOn(d)||1)*100))}
 const byDept={};in30.forEach(x=>byDept[x.dept]=(byDept[x.dept]||0)+x.net);
 const dn=DEPTS.filter(d=>byDept[d]).map(d=>({label:d,value:byDept[d],color:DEPT_COL[d]}));
 const byM={};led.filter(x=>x.type==='payment'&&x.date>=f30).forEach(x=>byM[x.method]=(byM[x.method]||0)+x.amount);
 const mb=Object.keys(byM).map((m,i)=>({label:m,value:byM[m],color:PAL[i%6]})).sort((a,b)=>b.value-a.value);
 const bySrc={};S.res.filter(r=>RS.includes(r.status)&&r.checkIn>=f30&&r.checkIn<=T).forEach(r=>bySrc[r.source]=(bySrc[r.source]||0)+1);
 const sb=Object.keys(bySrc).map((m,i)=>({label:m,value:bySrc[m],color:PAL[(i+2)%6]})).sort((a,b)=>b.value-a.value);
 const wo=S.tasks.filter(t=>t.status!=='Done').slice(0,5),low=S.inventory.filter(i=>i.qty<=i.reorder).slice(0,5);
 const segs=[['occupied','var(--occ)'],['inspected','var(--ok)'],['clean','color-mix(in srgb,var(--ok) 55%,var(--sf))'],['dirty','var(--warn)'],['ooo','var(--bad)']];
 const pr=(r,k)=>{const g=guest(r.guestId),rm=room(r.roomId);return `<div class="li"><span class="rn">${esc(rm.no)}</span><div style="flex:1;min-width:0"><div class="bold">${esc(g.name)}</div><div class="small muted">${k==='a'?nightsOf(r)+' night'+(nightsOf(r)>1?'s':'')+' · '+esc(r.source):'Balance '+money(folio(r).balance)}</div></div><button class="btn sm" data-act="${k==='a'?'checkin':'checkout'}" data-id="${r.id}">${k==='a'?'Check in':'Check out'}</button></div>`};
 return `<div class="hero">
 <div class="card"><div class="small muted">Occupancy today</div><div class="occ-big">${pct(occ)}</div>
  <div class="strip" role="img" aria-label="Room status mix">${segs.map(([k,c])=>st[k]?`<i style="width:${st[k]/S.rooms.length*100}%;background:${c}" title="${STL[k]}: ${st[k]}"></i>`:'').join('')}</div>
  <div class="legend">${segs.map(([k,c])=>`<span><i style="background:${c}"></i>${STL[k]} <b>${st[k]}</b></span>`).join('')}</div></div>
 <div class="kpis">
  ${kpi('Arrivals due',arr.length,'in house '+inh.length+' · leaving '+dep.length)}
  ${kpi('Revenue today',money(revToday),'excl. tax')}
  ${kpi('Revenue this month',money(revMtd),'excl. tax')}
  ${kpi('ADR, 30 days',money(adr),'average daily rate')}
  ${kpi('RevPAR, 30 days',money(revpar),'revenue per available room')}
  ${kpi('Collected today',money(collected),'outstanding '+money(arTot))}
 </div></div>
 <div class="g2 mt"><div class="card"><div class="hd"><h3>Revenue, last 14 days</h3><span class="legend" style="margin-left:auto"><span><i style="background:var(--c1)"></i>Rooms</span><span><i style="background:var(--c2)"></i>Other</span></span></div>${barChart(d14.map(fmtS),[{name:'Rooms',color:'var(--c1)',values:roomsD},{name:'Other',color:'var(--c2)',values:otherD}],{label:'Daily revenue for the last 14 days'})}</div>
 <div class="card"><h3>Occupancy, 2 weeks back and ahead</h3>${lineChart(l28,o28,{max:100,fmt:v=>Math.round(v)+'%',todayIdx:13,color:'var(--c3)',label:'Occupancy percentage by date'})}</div></div>
 <div class="g3 mt"><div class="card"><h3>Revenue mix, 30 days</h3>${dn.length?donut(dn,{center:'net'}):empty('No revenue yet')}</div>
  <div class="card"><h3>Payments by method, 30 days</h3>${hbars(mb)}</div>
  <div class="card"><h3>Bookings by source, 30 days</h3>${hbars(sb,v=>v)}</div></div>
 <div class="g3 mt"><div class="card"><div class="hd"><h3>Arrivals waiting</h3></div><div class="list">${arr.length?arr.slice(0,5).map(r=>pr(r,'a')).join(''):empty('No arrivals waiting')}</div></div>
  <div class="card"><div class="hd"><h3>Departures due</h3></div><div class="list">${dep.length?dep.slice(0,5).map(r=>pr(r,'d')).join(''):empty('No departures due')}</div></div>
  <div class="card"><div class="hd"><h3>Needs attention</h3></div><div class="list">${wo.map(t=>`<div class="li"><span class="chip ${t.priority==='Urgent'||t.priority==='High'?'bad':'warn'}">${t.priority}</span><div style="flex:1">${esc(t.title)}<div class="small muted">${t.roomId?'Room '+esc(room(t.roomId).no):esc(t.area)}</div></div></div>`).join('')}${low.map(i=>`<div class="li"><span class="chip warn">Low stock</span><div style="flex:1">${esc(i.name)}<div class="small muted">${i.qty} ${esc(i.unit)} left, reorder at ${i.reorder}</div></div></div>`).join('')}${!wo.length&&!low.length?empty('Nothing needs attention'):''}</div></div></div>`};

/* ---------- front desk ---------- */
V.frontdesk=()=>{
 const T=todayISO(),arr=S.res.filter(r=>r.status==='confirmed'&&r.checkIn<=T).sort((a,b)=>a.checkIn.localeCompare(b.checkIn));
 const inh=S.res.filter(r=>r.status==='checked_in').sort((a,b)=>room(a.roomId).no.localeCompare(room(b.roomId).no));

  return `<div class="li"><span class="rn">${esc(rm.no)}</span><div style="flex:1;min-width:0"><div class="bold">${esc(g.name)}${g.vip?' <span class="chip brand">VIP</span>':''}${late?' <span class="chip warn">Overdue</span>':''}</div><div class="small muted">${fmtS(r.checkIn)} to ${fmtS(r.checkOut)} · ${r.adults+r.children} guest${r.adults+r.children>1?'s':''} · ${f.balance>0.5?'Balance '+money(f.balance):'Settled'}</div></div>
  <div class="row"><button class="btn sm" data-act="openRes" data-id="${r.id}">Folio</button>${k==='a'?`<button class="btn sm pri" data-act="checkin" data-id="${r.id}">Check in</button>`:(r.checkOut<=T?`<button class="btn sm pri" data-act="checkout" data-id="${r.id}">Check out</button>`:'')}</div></div>`};
 return `<div class="bar-top"><button class="btn pri" data-act="walkin">Walk-in booking</button><span class="muted">Business date ${fmtD(T)}</span></div>
 <div class="g3"><div class="card"><div class="hd"><h3>Arrivals</h3><span class="chip brand">${arr.length}</span></div><div class="list">${arr.length?arr.map(r=>row(r,'a')).join(''):empty('No arrivals waiting')}</div></div>
 <div class="card"><div class="hd"><h3>In house</h3><span class="chip occ">${inh.length}</span></div><div class="list">${inh.length?inh.map(r=>row(r,'h')).join(''):empty('No guests in house')}</div></div>
 <div class="card"><div class="hd"><h3>Departures due</h3><span class="chip warn">${dep.length}</span></div><div class="list">${dep.length?dep.map(r=>row(r,'d')).join(''):empty('No departures due')}</div></div></div>`};

/* ---------- reservations ---------- */
V.reservations=()=>{
 const q=ui.q.toLowerCase();
 let list=S.res.filter(r=>(ui.status==='all'||r.status===ui.status)&&(ui.source==='all'||r.source===ui.source));
 if(q)list=list.filter(r=>{const g=guest(r.guestId),rm=room(r.roomId);return(r.code+' '+(g?g.name:'')+' '+(rm?rm.no:'')+' '+(g?g.phone:'')).toLowerCase().includes(q)});
 list.sort((a,b)=>b.checkIn.localeCompare(a.checkIn));
 const shown=list.slice(0,ui.limit);
 return `<div class="bar-top"><input class="inp sm" style="width:240px" id="q" data-in="q" placeholder="Search code, guest, phone or room" value="${esc(ui.q)}" aria-label="Search reservations">
 ${sel('fs',[['all','All statuses'],...Object.keys(RSL).map(k=>[k,RSL[k][0]])],ui.status,'class="inp sm" data-ch="fs"')}
 ${sel('fsrc',[['all','All sources'],...S.settings.sources],ui.source,'class="inp sm" data-ch="fsrc"')}
 <span class="muted small">${list.length} reservation${list.length===1?'':'s'}</span><div class="grow"></div>${csvBtn('reservations')}<button class="btn pri" data-act="newBooking">New booking</button></div>
 <div class="card" style="padding:0"><div class="tw"><table class="t"><thead><tr><th>Code</th><th>Guest</th><th>Room</th><th>Stay</th><th class="num">Nights</th><th>Status</th><th>Source</th><th class="num">Total</th><th class="num">Balance</th></tr></thead><tbody>
 ${shown.map(r=>{const g=guest(r.guestId),rm=room(r.roomId),f=folio(r);return `<tr class="click" data-act="openRes" data-id="${r.id}"><td class="bold">${r.code}</td><td>${esc(g.name)}</td><td>${esc(rm.no)}</td><td>${fmtS(r.checkIn)} to ${fmtS(r.checkOut)}</td><td class="num">${f.nights}</td><td>${rsChip(r.status)}</td><td>${esc(r.source)}</td><td class="num">${money(f.total)}</td><td class="num">${f.balance>0.5?`<span class="chip warn">${money(f.balance)}</span>`:'<span class="muted">0</span>'}</td></tr>`}).join('')||`<tr><td colspan="9">${empty('No reservations match. Try clearing the filters.')}</td></tr>`}
 </tbody></table></div></div>${list.length>shown.length?`<div class="row mt"><button class="btn" data-act="more">Show more</button><span class="muted small">Showing ${shown.length} of ${list.length}</span></div>`:''}`};

/* ---------- room rack (tape chart) ---------- */
V.tape=()=>{
 const n=ui.tapeDays,start=ui.tapeStart,T=todayISO(),days=[];for(let i=0;i<n;i++)days.push(addDays(start,i));
 const head=`<div class="tr head"><div class="tl"><b>Room</b></div><div class="tg" style="--n:${n}">${days.map((d,i)=>`<div class="th${d===T?' td':''}" style="grid-column:${i+1};grid-row:1"><span>${dow(d)}</span><b>${fmtS(d)}</b></div>`).join('')}</div></div>`;
 const rows=S.rooms.map(rm=>{const ty=typeOf(rm.typeId);
  const cells=days.map((d,i)=>`<button class="tc${isWk(d)?' wk':''}${d===T?' td':''}" style="grid-column:${i+1};grid-row:1" data-act="tapeNew" data-room="${rm.id}" data-date="${d}" aria-label="New booking, room ${rm.no}, ${d}"></button>`).join('');
  const bars=S.res.filter(r=>r.roomId===rm.id&&RS.includes(r.status)&&r.checkIn<addDays(start,n)&&r.checkOut>start).map(r=>{const a=Math.max(0,nightsBetween(start,r.checkIn)),b=Math.min(n,nightsBetween(start,r.checkOut)),g=guest(r.guestId);
   return `<button class="rb ${r.status}" style="grid-column:${a+1}/${b+1};grid-row:1" data-act="openRes" data-id="${r.id}" title="${esc(g.name)} · ${r.code}">${esc(g.name)}</button>`}).join('');
  const ooo=rm.ooo?`<div class="rb ooo" style="grid-column:1/${n+1};grid-row:1">Out of order: ${esc(rm.oooReason||'maintenance')}</div>`:'';
  return `<div class="tr"><div class="tl"><b>${rm.no}</b><small>${esc(ty.name)}</small></div><div class="tg" style="--n:${n}">${cells}${bars}${ooo}</div></div>`}).join('');
 return `<div class="bar-top"><button class="btn" data-act="tapeMove" data-d="-7" aria-label="Back one week">Back</button><button class="btn" data-act="tapeToday">Today</button><button class="btn" data-act="tapeMove" data-d="7" aria-label="Forward one week">Forward</button>
 <div class="seg" role="group" aria-label="Days shown">${[7,14,21,30].map(k=>`<button data-act="tapeDays" data-n="${k}" aria-pressed="${ui.tapeDays===k}">${k} days</button>`).join('')}</div>
 <span class="legend"><span><i style="background:var(--brandbg);box-shadow:inset 3px 0 0 var(--brand)"></i>Confirmed</span><span><i style="background:var(--occ)"></i>In house</span><span><i style="background:var(--sf2);border:1px solid var(--line)"></i>Checked out</span></span>
 <span class="muted small">Click an empty night to book it, or a bar to open the folio.</span></div><div class="tape">${head}${rows}</div>`};

/* ---------- guests ---------- */
V.guests=()=>{

 S.res.forEach(r=>{if(r.status==='checked_in'||r.status==='checked_out'){stays[r.guestId]=(stays[r.guestId]||0)+1;spend[r.guestId]=(spend[r.guestId]||0)+folio(r).total}});

 ${list.slice(0,150).map(g=>`<tr class="click" data-act="guestOpen" data-id="${g.id}"><td class="bold">${esc(g.name)}${g.vip?' <span class="chip brand">VIP</span>':''}</td><td>${esc(g.phone)}</td><td>${esc(g.email)}</td><td>${esc(g.company)}</td><td>${esc(g.nationality)}</td><td class="num">${stays[g.id]||0}</td><td class="num">${money(spend[g.id]||0)}</td></tr>`).join('')||`<tr><td colspan="7">${empty('No guests match your search.')}</td></tr>`}</tbody></table></div></div>`};

/* ---------- rooms and rates ---------- */
V.rooms=()=>{
 let list=S.rooms.filter(r=>(ui.rmType==='all'||r.typeId===ui.rmType)&&(ui.rmFloor==='all'||String(r.floor)===ui.rmFloor)&&(ui.rmState==='all'||roomState(r)===ui.rmState));

 <div class="bar-top mt">${sel('rt',[['all','All types'],...S.types.map(t=>[t.id,t.name])],ui.rmType,'class="inp sm" data-ch="rmType"')}${sel('rfl',[['all','All floors'],...floors.map(f=>[String(f),'Floor '+f])],ui.rmFloor,'class="inp sm" data-ch="rmFloor"')}${sel('rst',[['all','Any status'],...Object.keys(STL).map(k=>[k,STL[k]])],ui.rmState,'class="inp sm" data-ch="rmState"')}<span class="muted small">${list.length} rooms</span><div class="grow"></div><button class="btn pri" data-act="roomNew">Add room</button></div>
 <div class="card" style="padding:0"><div class="tw"><table class="t"><thead><tr><th>Room</th><th>Floor</th><th>Type</th><th>Status</th><th>Current guest</th><th>Next arrival</th><th></th></tr></thead><tbody>
 ${list.map(rm=>{const ih=inhouse(rm),nx=S.res.filter(r=>r.roomId===rm.id&&r.status==='confirmed'&&r.checkIn>=todayISO()).sort((a,b)=>a.checkIn.localeCompare(b.checkIn))[0];
  return `<tr><td class="bold">${rm.no}</td><td>${rm.floor}</td><td>${esc(typeOf(rm.typeId).name)}</td><td>${roomChip(roomState(rm))}${rm.ooo?` <span class="small muted">${esc(rm.oooReason)}</span>`:''}</td><td>${ih?esc(guest(ih.guestId).name):'<span class="muted">Vacant</span>'}</td><td>${nx?fmtS(nx.checkIn)+' · '+esc(guest(nx.guestId).name):'<span class="muted">None booked</span>'}</td><td class="row"><button class="btn sm" data-act="roomEdit" data-id="${rm.id}">Edit</button><button class="btn sm" data-act="roomOoo" data-id="${rm.id}">${rm.ooo?'Return to service':'Take out of order'}</button></td></tr>`}).join('')||`<tr><td colspan="7">${empty('No rooms match the filters.')}</td></tr>`}</tbody></table></div></div>`};

/* ---------- housekeeping ---------- */
V.housekeeping=()=>{
 const st={};S.rooms.forEach(r=>{const k=roomState(r);st[k]=(st[k]||0)+1});
 const hkStaff=S.staff.filter(s=>s.role==='Housekeeping'&&s.active);

 return `<div class="bar-top"><div class="seg" role="group" aria-label="Filter rooms">${[['all','All'],['dirty','Dirty'],['clean','Clean'],['inspected','Inspected'],['occupied','Occupied'],['ooo','Out of order']].map(([k,l])=>`<button data-act="hkFilter" data-k="${k}" aria-pressed="${ui.hk===k}">${l}${k!=='all'?' '+(st[k]||0):''}</button>`).join('')}</div><div class="grow"></div><button class="btn" data-act="hkAssign">Auto-assign dirty rooms</button></div>
 ${floors.map(fl=>`<h3 class="mt" style="margin-bottom:8px">Floor ${fl}</h3><div class="rooms">${list.filter(r=>r.floor===fl).map(rm=>{const s=roomState(rm),ih=inhouse(rm);

/* ---------- statements ---------- */
function incomeData(from,to){
 const rv=revenueBy(from,to),ex=S.expenses.filter(e=>e.date>=from&&e.date<=to&&e.category!=='Tax remittance'),by={};
 ex.forEach(e=>by[e.category]=(by[e.category]||0)+e.amount);
 const rev=DEPTS.concat(Object.keys(rv.by).filter(d=>!DEPTS.includes(d)));
 const cogs=by['Food & beverage cost']||0,opex=EXP_CATS.filter(c=>c!=='Food & beverage cost'&&c!=='Tax remittance');
 const opexTot=sum(opex,c=>by[c]||0);
 return{rev,rvBy:rv.by,revTot:rv.net,vat:rv.tax,cogs,gp:rv.net-cogs,opex,by,opexTot,net:rv.net-cogs-opexTot};
}
function statementRows(){
 const T=todayISO(),from=ui.range.from,to=ui.range.to>T?T:ui.range.to;
 if(ui.stmt==='income'){const len=nightsBetween(from,to)+1,pT=addDays(from,-1),pF=addDays(pT,-(len-1)),c=incomeData(from,to),p=incomeData(pF,pT),rows=[];
  rows.push(['Revenue (net of tax)',null,null,'hdr']);
  c.rev.forEach(d=>{if(c.rvBy[d]||p.rvBy[d])rows.push([d,c.rvBy[d]||0,p.rvBy[d]||0,'sub'])});
  rows.push(['Total revenue',c.revTot,p.revTot,'tot']);
  rows.push(['Cost of sales',null,null,'hdr']);rows.push(['Food and beverage cost',c.cogs,p.cogs,'sub']);
  rows.push(['Gross profit',c.gp,p.gp,'tot']);
  rows.push(['Operating expenses',null,null,'hdr']);
  c.opex.forEach(k=>rows.push([k,c.by[k]||0,p.by[k]||0,'sub']));
  rows.push(['Total operating expenses',c.opexTot,p.opexTot,'tot']);
  rows.push(['Net operating profit',c.net,p.net,'gt']);
  rows.push(['Net margin',c.revTot?c.net/c.revTot*100:0,p.revTot?p.net/p.revTot*100:0,'pct']);
  return{title:'Income statement',sub:fmtD(from)+' to '+fmtD(to)+' compared with '+fmtD(pF)+' to '+fmtD(pT),cols:['This period','Prior period'],rows,note:'Management accounts before depreciation, interest and income tax. Revenue excludes VAT.'}}
 if(ui.stmt==='balance'){const b=balanceSheet(to),cashTot=sum(Object.values(b.cash),v=>v),rows=[];
  rows.push(['Assets',null,'hdr']);Object.keys(b.cash).forEach(k=>rows.push([k,b.cash[k],'sub']));
  rows.push(['Total cash and bank',cashTot,'tot']);rows.push(['Guest receivables',b.ar,'sub']);
  const ta=cashTot+b.ar;rows.push(['Total assets',ta,'gt']);
  rows.push(['Liabilities',null,'hdr']);rows.push(['Guest deposits and advance payments',b.dep,'sub']);rows.push(['VAT payable',b.vatPay,'sub']);
  const tl=b.dep+b.vatPay;rows.push(['Total liabilities',tl,'tot']);
  rows.push(['Equity',null,'hdr']);rows.push(['Opening capital (cash at start)',b.opening,'sub']);rows.push(['Retained earnings',b.retained,'sub']);
  const te=b.opening+b.retained;rows.push(['Total equity',te,'tot']);rows.push(['Total liabilities and equity',tl+te,'gt']);
  rows.push(['Memo: stock on hand at cost (not capitalised)',b.stock,'sub']);
  return{title:'Balance sheet',sub:'As at '+fmtD(to),cols:['Amount'],rows,check:Math.abs(ta-(tl+te))<1,note:'Simplified position: stock, fixed assets and depreciation are not recorded.'}}
 if(ui.stmt==='cash'){const led=ledger(from,to),rows=[],open=sum(Object.values(cashAsAt(addDays(from,-1))),v=>v),close=sum(Object.values(cashAsAt(to)),v=>v);
  rows.push(['Receipts from guests',null,'hdr']);METHODS.forEach(m=>{const v=sum(led.filter(x=>x.type==='payment'&&x.method===m),'amount')-sum(led.filter(x=>x.type==='refund'&&x.method===m),'amount');rows.push([m+' (net of refunds)',v,'sub'])});
  const rec=sum(led.filter(x=>x.type==='payment'),'amount')-sum(led.filter(x=>x.type==='refund'),'amount');rows.push(['Total receipts',rec,'tot']);
  rows.push(['Payments to suppliers and staff',null,'hdr']);let out=0;const ex=S.expenses.filter(e=>e.date>=from&&e.date<=to);EXP_CATS.forEach(c=>{const v=sum(ex.filter(e=>e.category===c),'amount');if(v){out+=v;rows.push([c,-v,'sub'])}});
  rows.push(['Total payments',-out,'tot']);rows.push(['Net cash movement',rec-out,'tot']);
  rows.push(['Opening cash and bank',open,'sub']);rows.push(['Closing cash and bank',close,'gt']);
  return{title:'Cash flow',sub:fmtD(from)+' to '+fmtD(to),cols:['Amount'],rows,note:'Direct method. Card settlements are treated as received into the bank account.'}}
 const rv=revenueBy(from,to),rem=sum(S.expenses.filter(e=>e.category==='Tax remittance'&&e.date>=from&&e.date<=to),'amount'),rows=[];
 rows.push(['Output VAT charged, by department',null,'hdr']);DEPTS.forEach(d=>{const v=sum(rv.rows.filter(x=>x.dept===d),'tax');if(v)rows.push([d,v,'sub'])});
 rows.push(['Total output VAT',rv.tax,'tot']);rows.push(['Remitted to tax authority',-rem,'sub']);rows.push(['Net movement in VAT payable',rv.tax-rem,'tot']);
 rows.push(['VAT payable at end of period',balanceSheet(to).vatPay,'gt']);
 return{title:'Tax summary',sub:fmtD(from)+' to '+fmtD(to)+' at '+S.settings.vat+'% VAT',cols:['Amount'],rows,note:'Input VAT on purchases is not tracked. Confirm returns with your tax adviser before filing.'}}

 const delta=(a,b)=>b?`<td class="num muted">${(a-b)/Math.abs(b)*100>=0?'+':''}${((a-b)/Math.abs(b)*100).toFixed(0)}%</td>`:'<td></td>';

A.checkin=el=>{
 const id=el.dataset.id,r=resv(id),rm=room(r.roomId),T=todayISO(),oc=inhouse(rm);
 if(rm.ooo){toast('Room '+rm.no+' is out of order. Move the guest to another room first.','bad');return}
 if(oc&&oc.id!==r.id){toast('Room '+rm.no+' still has '+guest(oc.guestId).name+' in house.','bad');return}

 const go=()=>{if(r.checkIn>T)r.checkIn=T;r.status='checked_in';r.actualIn=T+' '+nowTime();toast(guest(r.guestId).name+' checked in to room '+rm.no,'ok');closeModal();commit();if(f2(r))resModal(id)};

A.checkout=el=>{
 const id=el.dataset.id,r=resv(id),f=folio(r);
 if(f.balance>0.5){pending=null;modalRes=null;openModal('Balance outstanding',`<p style="margin:0 0 8px">${esc(guest(r.guestId).name)} still owes <b>${money2(f.balance)}</b> on room ${room(r.roomId).no}.</p><p class="muted small" style="margin:0">Collect payment now, or bill it to an account and follow it up under Receivables.</p>`,`<button class="btn" data-act="closeModal">Cancel</button><button class="btn" data-act="billAccount" data-id="${id}">Bill to account</button><button class="btn pri" data-act="pay" data-id="${id}" data-co="1">Take payment and check out</button>`);return}
 doCheckout(id);
};
function doCheckout(id,bill){
 const r=resv(id),rm=room(r.roomId),T=todayISO();
 r.status='checked_out';r.actualOut=T+' '+nowTime();

A.resCancel=el=>{
 const r=resv(el.dataset.id),kind=el.dataset.kind||'cancel',f=folio(r);

 openModal(kind==='noshow'?'Mark as no-show':'Cancel booking '+r.code,`<div class="frm">${f.paid>0.5?fld('Deposit held: '+money2(f.paid),sel('cx_opt',[['refund','Refund the full amount'],['retain','Keep it as a cancellation fee']],'refund'),'full'):''}${fld('Reason',inp('cx_reason',''),'full')}</div>`,`<button class="btn" data-act="closeModal">Keep booking</button><button class="btn danger" data-act="cancelGo">${kind==='noshow'?'Mark no-show':'Cancel booking'}</button>`);
 pending={id:r.id,kind};
};
A.cancelGo=()=>{
 const {id,kind}=pending,r=resv(id),f=folio(r),T=todayISO();
 if(f.paid>0.5){
  if(gv('cx_opt')==='retain'){const net=round2(f.paid/(1+S.settings.vat/100));S.txns.push({id:nextTxn(),resId:id,date:T,time:nowTime(),type:'charge',dept:'Other',method:'',net,tax:round2(f.paid-net),amount:f.paid,ref:'FEE'+rand(4),note:kind==='noshow'?'No-show fee (deposit retained)':'Cancellation fee (deposit retained)'})}
  else{const by={};f.pays.forEach(t=>by[t.method]=(by[t.method]||0)+t.amount);f.rf.forEach(t=>by[t.method]=(by[t.method]||0)-t.amount);

 }
 r.status=kind==='noshow'?'no_show':'cancelled';const why=gv('cx_reason').trim();if(why)r.notes=(r.notes?r.notes+' · ':'')+why;
 closeModal();commit();toast(kind==='noshow'?'Marked as no-show':'Booking cancelled','ok');
};

function recordPayment(id,method,amount,ref,note){S.txns.push({id:nextTxn(),resId:id,date:todayISO(),time:nowTime(),type:'payment',dept:'',method,net:0,tax:0,amount:round2(amount),ref,note})}
function payModal(id,o){
 o=o||{};const r=resv(id),g=guest(r.guestId),f=folio(r);
 if(!pay||pay.id!==id||o.fresh)pay={id,method:'M-Pesa',amount:Math.max(0,f.balance),phone:g.phone,co:!!o.co,stage:'form'};
 if(o.co!=null&&o.fresh)pay.co=!!o.co;
 Object.assign(pay,o.set||{});
 modalRes=null;
 const m=pay.method;let fields='';
 if(m==='Cash')fields=fld('Cash received',inp('pay_tend',pay.tend||'','type="number" min="0" step="0.01" data-in="payTend"'))+`<div class="fld"><span>Change to give</span><div class="bold" id="pay_chg" style="padding:7px 0">${money2(0)}</div></div>`;
 else if(m==='M-Pesa')fields=fld('Guest M-Pesa number',inp('pay_phone',pay.phone,'inputmode="tel"'))+fld('M-Pesa receipt code',inp('pay_ref',pay.ref||''));
 else fields=fld(m==='Card'?'Card receipt or terminal reference':'Bank reference',inp('pay_ref',pay.ref||''),'full');
 const body=`<div class="note" style="margin-bottom:12px">Balance due <b>${money2(f.balance)}</b> on ${r.code}, room ${room(r.roomId).no}.</div><div class="pay-methods" role="group" aria-label="Payment method">${METHODS.map(x=>`<button class="pm" data-act="payMethod" data-m="${x}" aria-pressed="${m===x}">${x}</button>`).join('')}</div>
 <div class="frm">${fld('Amount',inp('pay_amt',pay.amount,'type="number" min="0" step="0.01"'),'full')}${fields}<div class="full" id="pay_err"></div></div>`;
 openModal('Record payment',body,`<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="payGo">Record payment</button>`);
}

IN.payTend=el=>{const c=$id('pay_chg');if(c)c.textContent=money2(Math.max(0,gn('pay_tend')-gn('pay_amt')))};
function payDone(ref,method,note){
 recordPayment(pay.id,method,pay.amount,ref,note);const id=pay.id,co=pay.co;pay=null;H.save();
 if(co){doCheckout(id);toast('Payment received. Guest checked out.','ok')}else{render();resModal(id);toast('Payment of '+money2(S.txns[S.txns.length-1].amount)+' recorded','ok')}
}
A.payGo=()=>{
 const f=folio(resv(pay.id)),amt=round2(gn('pay_amt')),err=m=>{$id('pay_err').innerHTML=`<div class="note bad">${esc(m)}</div>`},m=pay.method;
 if(amt<=0)return err('Enter an amount above zero.');
 if(amt>f.balance+0.5)return err('That is more than the balance due ('+money2(f.balance)+').');
 pay.amount=amt;
 if(m==='Cash'){const t=gn('pay_tend');if(t&&t<amt)return err('Cash received is less than the amount.');return payDone('CSH'+rand(4),'Cash',t>amt?'Change given '+money2(t-amt):'')}
 if(m==='Bank'){const rf=gv('pay_ref').trim();if(!rf)return err('Enter the bank reference.');return payDone(rf,'Bank','Bank transfer')}
 if(m==='M-Pesa'){let p=gv('pay_phone').replace(/[\s+\-]/g,'');if(/^0[71]\d{8}$/.test(p))p='254'+p.slice(1);if(!/^254[71]\d{8}$/.test(p))return err('Enter a valid Kenyan mobile number.');
  const ref=gv('pay_ref').trim().toUpperCase();if(!ref)return err('Enter the M-Pesa receipt code after confirming payment.');return payDone(ref,'M-Pesa','M-Pesa from '+p)}
 const ref=gv('pay_ref').trim();if(!ref)return err(m==='Card'?'Enter the card receipt or terminal reference.':'Enter the bank reference.');
 payDone(ref,m,m==='Card'?'Card payment confirmed':'Bank transfer');
};

 const d={no,floor:Math.round(gn('rm_fl')),typeId:gv('rm_type')};if(id)Object.assign(room(id),d);else S.rooms.push(Object.assign({id:uid('rm'),hk:'clean',ooo:false,oooReason:'',assignee:''},d));
 S.rooms.sort((a,b)=>a.no.localeCompare(b.no,undefined,{numeric:true}));closeModal();commit();toast('Room saved','ok')};
A.roomDel=el=>{const r=room(el.dataset.id);if(S.res.some(x=>x.roomId===r.id)){toast('Room '+r.no+' has reservation history and cannot be deleted. Take it out of order instead.','bad');return}
 confirmBox('Delete room '+r.no+'?','This removes the room from the property.','Delete',()=>{S.rooms=S.rooms.filter(x=>x.id!==r.id);commit()},true)};
A.roomOoo=el=>{const r=room(el.dataset.id);
 if(r.ooo){r.ooo=false;r.oooReason='';r.hk='dirty';setAvailability(r.id,todayISO(),addDays(todayISO(),365),true,'');S.tasks.forEach(t=>{if(t.roomId===r.id&&t.blocks&&t.status!=='Done')t.status='Done'});commit();toast('Room '+r.no+' is back in service and needs cleaning','ok');return}
 if(inhouse(r)){toast('Room '+r.no+' has a guest in house. Move them first.','bad');return}
 modalRes=null;openModal('Take room '+r.no+' out of order',fld('Reason',inp('oo_reason','','placeholder="e.g. AC fault"'))+'<div id="oo_err"></div>',`<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="oooSave" data-id="${r.id}">Take out of order</button>`)};
A.oooSave=el=>{const r=room(el.dataset.id),why=gv('oo_reason').trim();if(!why){$id('oo_err').innerHTML='<div class="note bad mt">Enter a reason.</div>';return}
 r.ooo=true;r.oooReason=why;setAvailability(r.id,todayISO(),addDays(todayISO(),365),false,why);S.tasks.push({id:uid('w'),roomId:r.id,area:'',title:why,priority:'High',status:'Open',assignee:'',created:todayISO(),blocks:true,notes:''});closeModal();commit();toast('Room '+r.no+' is out of order. A work order was opened.')};

/* ---------- housekeeping and maintenance ---------- */
A.hkFilter=el=>{ui.hk=el.dataset.k;render()};
A.hkSet=el=>{room(el.dataset.id).hk=el.dataset.s;commit()};
CH.hkAssignee=el=>{room(el.dataset.id).assignee=el.value;H.save()};
A.hkAssign=()=>{const st=S.staff.filter(s=>s.role==='Housekeeping'&&s.active);if(!st.length){toast('Add active housekeeping staff first','bad');return}
 let i=0,n=0;S.rooms.filter(r=>roomState(r)==='dirty'&&!r.assignee).forEach(r=>{r.assignee=st[i++%st.length].id;n++});commit();toast(n?n+' rooms assigned':'Every dirty room already has an attendant','ok')};
A.woFilter=el=>{ui.wo=el.dataset.k;render()};
A.woNew=()=>{modalRes=null;const ms=S.staff.filter(s=>s.role==='Maintenance'&&s.active);
 openModal('New work order',`<div class="frm">${fld('Issue',inp('w_title',''),'full')}${fld('Room',sel('w_room',[['','No room (general area)'],...S.rooms.map(r=>[r.id,'Room '+r.no])],''))}${fld('Area, if no room',inp('w_area',''))}${fld('Priority',sel('w_pri',['Low','Medium','High','Urgent'],'Medium'))}${fld('Assign to',sel('w_who',[['','Unassigned'],...ms.map(s=>[s.id,s.name])],''))}${fld('Take room out of order?',sel('w_blk',[['no','No'],['yes','Yes']],'no'),'full')}${fld('Notes',inp('w_notes',''),'full')}<div class="full" id="w_err"></div></div>`,`<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="woSave">Create work order</button>`)};
A.woSave=()=>{const t=gv('w_title').trim(),rid=gv('w_room'),blk=gv('w_blk')==='yes'&&rid,err=m=>{$id('w_err').innerHTML=`<div class="note bad">${esc(m)}</div>`};
 if(!t)return err('Describe the issue.');if(!rid&&!gv('w_area').trim())return err('Pick a room or enter an area.');
 if(blk&&inhouse(room(rid)))return err('That room has a guest in house. Move them first.');
 S.tasks.push({id:uid('w'),roomId:rid||null,area:gv('w_area').trim(),title:t,priority:gv('w_pri'),status:'Open',assignee:gv('w_who'),created:todayISO(),blocks:!!blk,notes:gv('w_notes')});
 if(blk){const r=room(rid);r.ooo=true;r.oooReason=t;setAvailability(r.id,todayISO(),addDays(todayISO(),365),false,t)}closeModal();commit();toast('Work order created','ok')};
A.woStatus=el=>{const t=S.tasks.find(x=>x.id===el.dataset.id);t.status=el.dataset.s;
 if(t.status==='Done'&&t.blocks&&t.roomId){const r=room(t.roomId);if(r&&!S.tasks.some(x=>x.id!==t.id&&x.roomId===t.roomId&&x.blocks&&x.status!=='Done')){r.ooo=false;r.oooReason='';r.hk='dirty';setAvailability(r.id,todayISO(),addDays(todayISO(),365),true,'')}}
 commit()};
A.woDel=el=>{S.tasks=S.tasks.filter(x=>x.id!==el.dataset.id);commit()};

/* ---------- point of sale ---------- */
A.posAdd=el=>{const c=ui.pos.cart;c[el.dataset.id]=(c[el.dataset.id]||0)+1;render()};
A.posQty=el=>{const c=ui.pos.cart,k=el.dataset.id;c[k]=(c[k]||0)+(+el.dataset.d);if(c[k]<=0)delete c[k];render()};
A.posClear=()=>{ui.pos.cart={};render()};
CH.posRes=el=>{ui.pos.resId=el.value;render()};
A.posPost=()=>{const id=ui.pos.resId,items=Object.keys(ui.pos.cart);if(!id||!items.length)return;
 items.forEach(k=>{const c=S.catalog.find(x=>x.id===k);if(c)postCharge(id,c.dept,c.name,c.price,ui.pos.cart[k])});
 const r=resv(id);ui.pos.cart={};commit();toast('Posted to room '+room(r.roomId).no+' folio','ok')};
A.posCustom=()=>{if(ui.pos.resId)chargeModal(ui.pos.resId)};

/* ---------- inventory, staff, expenses ---------- */
A.invNew=()=>{modalRes=null;openModal('Add stock item',`<div class="frm">${fld('Item',inp('i_name',''),'full')}${fld('Category',inp('i_cat','Cleaning'))}${fld('Unit',inp('i_unit','pcs'))}${fld('On hand',inp('i_qty',0,'type="number" min="0"'))}${fld('Reorder level',inp('i_re',10,'type="number" min="0"'))}${fld('Unit cost',inp('i_cost',0,'type="number" min="0"'))}<div class="full" id="i_err"></div></div>`,`<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="invSave">Save item</button>`)};
A.invSave=()=>{const n=gv('i_name').trim();if(!n){$id('i_err').innerHTML='<div class="note bad">Enter the item name.</div>';return}
 S.inventory.push({id:uid('i'),name:n,category:gv('i_cat'),unit:gv('i_unit'),qty:gn('i_qty'),reorder:gn('i_re'),cost:gn('i_cost')});closeModal();commit()};
function qtyModal(id,mode){const i=S.inventory.find(x=>x.id===id);modalRes=null;openModal((mode==='use'?'Use ':'Receive ')+i.name,`<div class="frm">${fld('Quantity ('+i.unit+')',inp('q_qty',1,'type="number" min="1"'))}${mode==='recv'?fld('Unit cost',inp('q_cost',i.cost,'type="number" min="0"')):''}<div class="full" id="q_err"></div></div><p class="small muted">On hand now: ${i.qty} ${esc(i.unit)}</p>`,`<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="qtyGo" data-id="${id}" data-mode="${mode}">${mode==='use'?'Issue stock':'Receive stock'}</button>`)}
A.invUse=el=>qtyModal(el.dataset.id,'use');A.invRecv=el=>qtyModal(el.dataset.id,'recv');
A.qtyGo=el=>{const i=S.inventory.find(x=>x.id===el.dataset.id),q=gn('q_qty');if(q<=0)return;
 if(el.dataset.mode==='use'){if(q>i.qty){$id('q_err').innerHTML='<div class="note bad">Only '+i.qty+' on hand.</div>';return}i.qty-=q}else{i.qty+=q;if(gn('q_cost')>0)i.cost=gn('q_cost')}closeModal();commit()};
A.invDel=el=>{confirmBox('Remove this item?','It will be deleted from stock records.','Remove',()=>{S.inventory=S.inventory.filter(x=>x.id!==el.dataset.id);commit()},true)};
function staffForm(s){s=s||{};return `<div class="frm">${fld('Full name',inp('sf_name',s.name||''))}${fld('Phone',inp('sf_phone',s.phone||''))}${fld('Role',sel('sf_role',['Front desk','Housekeeping','Maintenance','F&B','Security','Management'],s.role||'Front desk'))}${fld('Shift',sel('sf_shift',['Morning','Evening','Night'],s.shift||'Morning'))}<div class="full" id="sf_err"></div></div>`}
A.staffNew=()=>{modalRes=null;openModal('Add staff member',staffForm(),`<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="staffSave">Save</button>`)};
A.staffEdit=el=>{modalRes=null;openModal('Edit staff member',staffForm(staffOf(el.dataset.id)),`<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="staffSave" data-id="${el.dataset.id}">Save</button>`)};
A.staffSave=el=>{const id=el&&el.dataset.id,n=gv('sf_name').trim();if(!n){$id('sf_err').innerHTML='<div class="note bad">Enter the name.</div>';return}
 const d={name:n,phone:gv('sf_phone'),role:gv('sf_role'),shift:gv('sf_shift')};if(id)Object.assign(staffOf(id),d);else S.staff.push(Object.assign({id:uid('st'),active:true},d));closeModal();commit()};
A.staffToggle=el=>{const s=staffOf(el.dataset.id);s.active=!s.active;commit()};
A.expNew=()=>{modalRes=null;openModal('Record expense',`<div class="frm">${fld('Date',inp('x_date',todayISO(),'type="date"'))}${fld('Category',sel('x_cat',EXP_CATS,'Supplies & consumables'))}${fld('Vendor or payee',inp('x_vendor',''))}${fld('Amount',inp('x_amt','','type="number" min="0" step="0.01"'))}${fld('Paid via',sel('x_method',['Bank','Cash','M-Pesa'],'Bank'))}${fld('Reference or note',inp('x_note',''))}<div class="full" id="x_err"></div></div>`,`<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="expSave">Save expense</button>`)};
A.expSave=()=>{const a=round2(gn('x_amt'));if(a<=0||!gv('x_vendor').trim()){$id('x_err').innerHTML='<div class="note bad">Enter who was paid and an amount above zero.</div>';return}
 S.expenses.push({id:uid('e'),date:gv('x_date')||todayISO(),category:gv('x_cat'),vendor:gv('x_vendor').trim(),amount:a,method:gv('x_method'),ref:'EXP'+rand(4),note:gv('x_note')});closeModal();commit();toast('Expense recorded','ok')};
A.expDel=el=>{confirmBox('Delete this expense?','It will be removed from your statements.','Delete',()=>{S.expenses=S.expenses.filter(x=>x.id!==el.dataset.id);commit()},true)};

/* ---------- settings ---------- */
A.setSave=()=>{const s=S.settings;
 if($id('s_hotel')){s.hotel=gv('s_hotel').trim()||s.hotel;s.currency=gv('s_cur').trim().toUpperCase()||s.currency;s.vat=Math.max(0,gn('s_vat'));s.taxPin=gv('s_pin');s.checkInTime=gv('s_in');s.checkOutTime=gv('s_out');s.openingCash=gn('s_open');const src=gv('s_src').split(',').map(x=>x.trim()).filter(Boolean);if(src.length)s.sources=src}
 if($id('s_menv')){s.mpesaEnv=gv('s_menv');s.mpesaShort=gv('s_mshort');s.mpesaCallback=gv('s_mcb');s.cardProvider=gv('s_cprov');s.cardKey=gv('s_ckey')}
 commit();toast('Settings saved','ok')};
function planForm(p){p=p||{};return `<div class="frm">${fld('Plan name',inp('pl_name',p.name||''),'full')}${fld('Price as % of rack rate',inp('pl_mult',Math.round((p.mult||1)*100),'type="number" min="1" max="300"'),'full')}</div>`}
A.planNew=()=>{modalRes=null;openModal('Add rate plan',planForm(),`<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="planSave">Save</button>`)};
A.planEdit=el=>{modalRes=null;openModal('Edit rate plan',planForm(planOf(el.dataset.id)),`<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="planSave" data-id="${el.dataset.id}">Save</button>`)};
A.planSave=el=>{const id=el&&el.dataset.id,n=gv('pl_name').trim();if(!n)return;const d={name:n,mult:Math.max(.01,gn('pl_mult')/100)};if(id)Object.assign(planOf(id),d);else S.plans.push(Object.assign({id:uid('p')},d));closeModal();commit()};
A.planDel=el=>{if(S.res.some(r=>r.planId===el.dataset.id)){toast('This plan is used by reservations. Edit it instead.','bad');return}S.plans=S.plans.filter(p=>p.id!==el.dataset.id);commit()};
function catForm(c){c=c||{};return `<div class="frm">${fld('Item name',inp('c_name',c.name||''),'full')}${fld('Department',sel('c_dept',DEPTS.filter(d=>d!=='Rooms'),c.dept||'F&B'))}${fld('Price, excl. tax',inp('c_price',c.price||'','type="number" min="0"'))}</div>`}
A.catNew=()=>{modalRes=null;openModal('Add menu item',catForm(),`<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="catSave">Save</button>`)};
A.catEdit=el=>{modalRes=null;openModal('Edit menu item',catForm(S.catalog.find(c=>c.id===el.dataset.id)),`<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="catSave" data-id="${el.dataset.id}">Save</button>`)};
A.catSave=el=>{const id=el&&el.dataset.id,n=gv('c_name').trim();if(!n||gn('c_price')<0)return;const d={name:n,dept:gv('c_dept'),price:gn('c_price')};if(id)Object.assign(S.catalog.find(c=>c.id===id),d);else S.catalog.push(Object.assign({id:uid('c')},d));closeModal();commit()};
A.catDel=el=>{S.catalog=S.catalog.filter(c=>c.id!==el.dataset.id);ui.pos.cart={};commit()};
A.backup=()=>saveFile('hotel-backup-'+todayISO()+'.json',JSON.stringify(S,null,2));
A.clearOps=()=>toast('Operational data deletion is disabled. Use the audited retention workflow in the API.','bad');

/* ---------- csv ---------- */
A.csv=el=>{const w=el.dataset.what,T=todayISO(),{from,to}=ui.range;let rows=[],name=w;
 if(w==='reservations'){rows=[['Code','Guest','Room','Check-in','Check-out','Nights','Status','Source','Rate','Total','Paid','Balance']].concat(S.res.map(r=>{const f=folio(r);return[r.code,guest(r.guestId).name,room(r.roomId).no,r.checkIn,r.checkOut,f.nights,r.status,r.source,r.rate,f.total,f.paid,f.balance]}))}
 else if(w==='guests')rows=[['Name','Phone','Email','ID','Nationality','Company','VIP']].concat(S.guests.map(g=>[g.name,g.phone,g.email,g.idNo,g.nationality,g.company,g.vip?'Yes':'No']));
 else if(w==='expenses')rows=[['Date','Category','Vendor','Method','Amount','Reference','Note']].concat(S.expenses.filter(e=>e.date>=from&&e.date<=to).map(e=>[e.date,e.category,e.vendor,e.method,e.amount,e.ref,e.note]));
 else if(w==='transactions')rows=[['Date','Time','Reference','Type','Dept or method','Guest','Room','Reservation','Net','Tax','Gross']].concat(X.txRows().map(x=>[x.date,x.time,x.ref,x.type,x.type==='charge'?x.dept:x.method,x.guest,x.room,x.code,x.type==='charge'?x.net:'',x.type==='charge'?x.tax:'',(x.type==='refund'?-1:1)*x.amount]));
 else if(w==='daily')rows=[['Date','Available','Sold','Occupancy %','ADR','RevPAR','Room revenue','Other revenue','Total']].concat(dayStats(from,to).map(d=>[d.date,d.avail,d.sold,Math.round(d.occ*100),Math.round(d.adr),Math.round(d.revpar),d.roomRev,d.other,d.total]));
 else if(w==='receivables')rows=[['Code','Guest','Company','Check-out','Balance']].concat(receivables().map(x=>[x.r.code,guest(x.r.guestId).name,guest(x.r.guestId).company,x.r.checkOut,x.f.balance]));
 else if(w==='statement'){const st=X.statementRows();name=ui.stmt;rows=[[st.title,st.sub],['',...st.cols]].concat(st.rows.map(r=>r.slice(0,-1).map(v=>v==null?'':(typeof v==='number'?Math.round(v*100)/100:v))))}
 saveFile('hotel-'+name+'-'+T+'.csv',toCSV(rows));
};

/* ---------- navigation and generic handlers ---------- */
A.go=el=>{ui.view=el.dataset.v;ui.navOpen=false;ui.limit=50;render();window.scrollTo(0,0)};
A.navToggle=()=>{ui.navOpen=!ui.navOpen;render()};A.navClose=()=>{ui.navOpen=false;render()};
A.newBooking=()=>bookingModal();A.walkin=()=>bookingModal({checkIn:todayISO()});
A.preset=el=>{setPreset(el.dataset.p);render()};
CH.range=()=>{let f=gv('rf'),t=gv('rt');if(!f||!t)return;if(f>t)[f,t]=[t,f];ui.range={preset:'custom',from:f,to:t};render()};
IN.q=el=>{ui.q=el.value;ui.limit=50;render()};IN.gq=el=>{ui.gq=el.value;render()};IN.txQ=el=>{ui.txQ=el.value;render()};
CH.fs=el=>{ui.status=el.value;ui.limit=50;render()};CH.fsrc=el=>{ui.source=el.value;ui.limit=50;render()};
CH.rmType=el=>{ui.rmType=el.value;render()};CH.rmFloor=el=>{ui.rmFloor=el.value;render()};CH.rmState=el=>{ui.rmState=el.value;render()};
CH.txType=el=>{ui.txType=el.value;render()};CH.expCat=el=>{ui.expCat=el.value;render()};
A.more=()=>{ui.limit+=50;render()};
A.tapeNew=el=>bookingModal({roomId:el.dataset.room,checkIn:el.dataset.date,checkOut:addDays(el.dataset.date,1)});
A.tapeMove=el=>{ui.tapeStart=addDays(ui.tapeStart,+el.dataset.d);render()};A.tapeToday=()=>{ui.tapeStart=addDays(todayISO(),-2);render()};A.tapeDays=el=>{ui.tapeDays=+el.dataset.n;render()};
A.cashTab=el=>{ui.cashTab=el.dataset.k;render()};A.stmtTab=el=>{ui.stmt=el.dataset.k;render()};A.rptTab=el=>{ui.rpt=el.dataset.k;render()};A.setTab=el=>{ui.setTab=el.dataset.k;render()};
function applyTheme(t){const r=document.documentElement;if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme')}
A.theme=()=>{let t='auto';try{t=localStorage.getItem('hms.theme')||'auto'}catch(e){}const n=t==='auto'?'dark':t==='dark'?'light':'auto';try{localStorage.setItem('hms.theme',n)}catch(e){}applyTheme(n);toast('Theme: '+n)};

document.addEventListener('click',e=>{
 if(e.target===$('#modal')){closeModal();return}
 const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();try{f(el,e)}catch(err){console.error(err);toast('Something went wrong: '+err.message,'bad')}}});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&IN[el.dataset.in])IN[el.dataset.in](el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&CH[el.dataset.ch])CH[el.dataset.ch](el,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalOpen())closeModal()});
H.load();sync();try{applyTheme(localStorage.getItem('hms.theme')||'auto')}catch(e){}
render();
window.__A={A,resModal,bookingModal,payModal,render,closeModal};
})();
</script></body></html>
